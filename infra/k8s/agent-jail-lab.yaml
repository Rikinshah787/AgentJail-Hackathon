apiVersion: v1
kind: Namespace
metadata:
  name: agent-jail-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-worker-12
  namespace: agent-jail-lab
  labels:
    app.kubernetes.io/name: gpu-worker-12
    agent-jail/resource-class: gpu-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-worker-12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-worker-12
    spec:
      containers:
        - name: worker
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: agent-jail-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
