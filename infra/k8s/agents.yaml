apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-jail
  namespace: agent-jail-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-jail-worker-restart
  namespace: agent-jail-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gpu-worker-12"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-jail-worker-restart
  namespace: agent-jail-lab
subjects:
  - kind: ServiceAccount
    name: agent-jail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-jail-worker-restart
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: agent-jail-lab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-jail
  namespace: agent-jail-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent-jail}
  template:
    metadata:
      labels: {app: agent-jail}
    spec:
      serviceAccountName: agent-jail
      containers:
        - name: gate
          image: agent-jail:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-jail
  namespace: agent-jail-lab
spec:
  selector: {app: agent-jail}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent
  namespace: agent-jail-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: ops-agent}
  template:
    metadata:
      labels: {app: ops-agent}
    spec:
      serviceAccountName: ops-agent
      containers:
        - name: ops-agent
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
